name: Build & test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            pluginval: pluginval_Windows.zip
            exe: pluginval.exe
          - os: macos-latest
            name: macOS
            pluginval: pluginval_macOS.zip
            exe: pluginval.app/Contents/MacOS/pluginval
          - os: ubuntu-24.04
            name: Linux
            pluginval: pluginval_Linux.zip
            exe: pluginval
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            libgl1-mesa-dev libxext-dev libfreetype-dev libfontconfig1-dev xvfb

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          # macOS: universal binary (Apple Silicon + Intel), macOS 11+
          if [ "$RUNNER_OS" == "macOS" ]; then EXTRA='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build
        shell: bash
        run: |
          # compiler errors are also reported as annotations (readable without downloading the log)
          set +e
          cmake --build build --config Release --parallel 4 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            grep -E "error( |:)|: fatal error|undefined reference|unresolved external" build.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          fi
          exit $rc

      - name: Unit tests
        shell: bash
        run: |
          T=$(find build -type f \( -name EffectorKillaTests -o -name EffectorKillaTests.exe \) -perm -u+x | head -n 1)
          [ -z "$T" ] && T=$(find build -type f -name "EffectorKillaTests.exe" | head -n 1)
          "$T"

      - name: pluginval (strictness 5)
        shell: bash
        env:
          # legacy switch (the editor no longer uses OpenGL); harmless
          EK_SOFTWARE_TV: "1"
        run: |
          curl -sSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}"
          unzip -q pv.zip
          VST3=$(find build -type d -name "TrapWin Effector.vst3" | head -n 1)
          if [ "$RUNNER_OS" == "Linux" ]; then PREFIX="xvfb-run -a"; fi
          $PREFIX ./${{ matrix.exe }} --strictness-level 5 --validate-in-process --timeout-ms 600000 "$VST3"

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p dist
          VST3=$(find build -type d -name "TrapWin Effector.vst3" | head -n 1)
          cp -R "$VST3" dist/
          find build -path "*Standalone*" \( -name "TrapWin Effector" -o -name "TrapWin Effector.exe" -o -name "TrapWin Effector.app" \) -maxdepth 6 \
            -exec cp -R {} dist/ \; || true

      - uses: actions/upload-artifact@v4
        with:
          name: TrapWinEffector-${{ matrix.name }}
          path: dist

      # ---- Windows installer (Inno Setup) ---------------------------------------------------
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $dist = (Resolve-Path dist).Path
          & $iscc "/DAppVersion=1.0.0" "/DSourceDir=$dist" installer\EffectorKilla.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: TrapWinEffector-Windows-Installer
          path: installer-out/*.exe

      # ---- macOS code signing + notarisation (runs only when the secrets exist) -----------------
      # Notarisation: either APPLE_API_KEY_P8 + APPLE_API_KEY_ID + APPLE_API_ISSUER_ID (App Store Connect key)
      #               or APPLE_ID + APPLE_TEAM_ID + APPLE_APP_PASSWORD.
      # Secrets: MACOS_CERT_P12 (base64 Developer ID Application .p12), MACOS_CERT_PASSWORD,
      #          MACOS_SIGN_IDENTITY ("Developer ID Application: Name (TEAMID)"),
      #          APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password)
      - name: macOS sign & notarise
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then echo "::warning::macOS NOT signed - signing secrets missing (unsigned build)."; exit 0; fi
          KC=build.keychain
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p ci "$KC"
          security import cert.p12 -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          curl -fsSL -o DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            && security import DeveloperIDG2CA.cer -k "$KC" || true
          security list-keychains -d user -s "$KC" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security find-identity -v -p codesigning "$KC"
          if [ -z "$MACOS_SIGN_IDENTITY" ]; then
            MACOS_SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          fi
          [ -n "$MACOS_SIGN_IDENTITY" ] || { echo "::error::No Developer ID Application identity in the .p12"; exit 1; }
          mkdir -p signed
          AU=$(find build -type d -name "TrapWin Effector.component" | head -n 1)
          APP=$(find build -type d -name "TrapWin Effector.app" | head -n 1)
          for b in "dist/TrapWin Effector.vst3" "$AU" "$APP"; do
            [ -n "$b" ] && [ -d "$b" ] || continue
            codesign --force --deep --options runtime --timestamp -s "$MACOS_SIGN_IDENTITY" "$b"
            cp -R "$b" signed/
          done
          ditto -c -k --keepParent signed TrapWinEffector-macOS-signed.zip
          if [ -n "$APPLE_API_KEY_P8" ]; then
            # normalise the pasted key: drop CR/whitespace, rebuild a proper PEM with 64-char lines
            P8="$APPLE_API_KEY_P8"
            # accept a base64-encoded .p8 file as well (secret pasted from a "base64 AuthKey.p8" file)
            if ! printf '%s' "$P8" | grep -q -- '-----BEGIN'; then
              DEC=$(printf '%s' "$P8" | tr -d ' \r\n\t' | base64 --decode 2>/dev/null || true)
              if printf '%s' "$DEC" | grep -q -- '-----BEGIN'; then P8="$DEC"; echo "APPLE_API_KEY_P8 was base64-encoded - decoded."; fi
            fi
            B64=$(printf '%s' "$P8" | tr -d '\r' | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \n\t')
            { echo "-----BEGIN PRIVATE KEY-----"; echo "$B64" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > AuthKey.p8
            openssl pkey -in AuthKey.p8 -noout || { echo "::error::APPLE_API_KEY_P8 is not a valid private key (base64 length ${#B64})"; exit 1; }
            APPLE_API_KEY_ID=$(printf '%s' "$APPLE_API_KEY_ID" | tr -d ' \r\n'); APPLE_API_ISSUER_ID=$(printf '%s' "$APPLE_API_ISSUER_ID" | tr -d ' \r\n')
            NOTARY=(--key AuthKey.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          else
            NOTARY=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD")
          fi
          xcrun notarytool submit TrapWinEffector-macOS-signed.zip "${NOTARY[@]}" --wait --output-format json | tee notary.json
          grep -q '"status" *: *"Accepted"' notary.json || { echo "::error::Notarization not accepted: $(cat notary.json)"; \
            xcrun notarytool log "$(sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p' notary.json | head -1)" "${NOTARY[@]}" || true; exit 1; }
          rm -f AuthKey.p8
          for b in signed/*; do xcrun stapler staple "$b"; xcrun stapler validate "$b"; codesign --verify --deep --strict "$b"; done
          rm TrapWinEffector-macOS-signed.zip
          ditto -c -k --keepParent signed TrapWinEffector-macOS-signed.zip
          echo "::notice::macOS signed ($MACOS_SIGN_IDENTITY), notarized and stapled: $(ls signed | tr '\n' ' ')"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: TrapWinEffector-macOS-signed
          path: TrapWinEffector-macOS-signed.zip
          if-no-files-found: ignore

  # ---- one release folder "trapwin.com" with everything for the shop ----------------------------
  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Assemble trapwin.com folder
        shell: bash
        run: |
          D="trapwin.com/TrapWin Effector 1.0.0"
          mkdir -p "$D/Windows" "$D/macOS" "$D/Docs"
          # Shop downloads: one zip per platform with the installer / plugins, install notes and EULA
          W=stage/win; M=stage/mac; mkdir -p "$W" "$M"
          cp artefacts/TrapWinEffector-Windows-Installer/*.exe "$W/"
          cp "installer/notes/INSTALL - Windows.txt" EULA.txt "$W/"
          (cd "$W" && zip -qry "$GITHUB_WORKSPACE/$D/Windows/TrapWinEffector-1.0.0-Windows.zip" .)
          if [ -d artefacts/TrapWinEffector-macOS-signed ]; then
            (cd "$M" && unzip -q ../../artefacts/TrapWinEffector-macOS-signed/*.zip)
            MZ="TrapWinEffector-1.0.0-macOS.zip"
          else
            cp -R artefacts/TrapWinEffector-macOS/. "$M/"
            MZ="TrapWinEffector-1.0.0-macOS-UNSIGNED.zip"
          fi
          cp "installer/notes/INSTALL - macOS.txt" EULA.txt "$M/"
          (cd "$M" && zip -qry --symlinks "$GITHUB_WORKSPACE/$D/macOS/$MZ" .)
          cp MANUAL.md "$D/Docs/TrapWin Effector Manual.md"
          cp EULA.txt "$D/Docs/"
          cp Resources/Fonts/*.txt "$D/Docs/"
          mkdir -p "$D/Shop"
          cp Resources/Marketing/*.png "$D/Shop/"
          ls -R trapwin.com
      - uses: actions/upload-artifact@v4
        with:
          name: trapwin.com
          path: trapwin.com
